name: Run power outages monitor

# Запускає сервер (workflow_dispatch), він же потім забирає artifact "result"
# і сам шле сповіщення в Telegram. Репозиторій нічого не комітить.
# Адреси приходять з сервера зашифрованими (AES-256, openssl), ключ - секрет TARGETS_KEY.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Зашифрований JSON адрес (openssl enc -aes-256-cbc -pbkdf2 -a -A)"
        required: true
        type: string

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Decrypt targets
        env:
          ENC: ${{ inputs.targets }}
          TARGETS_KEY: ${{ secrets.TARGETS_KEY }}
        run: |
          printf '%s' "$ENC" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:TARGETS_KEY             > "$RUNNER_TEMP/targets.json"

      - name: Run monitoring script
        env:
          TARGETS_FILE: ${{ runner.temp }}/targets.json
        run: node ./src/monitor.js

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: artifacts/result.json
          retention-days: 1
          if-no-files-found: error
