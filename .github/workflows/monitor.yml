name: Run power outages monitor

on:
  #schedule:
  #  - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Записати поточні відключення у стан без відправки в Telegram"
        required: false
        type: boolean
        default: false

# Не запускати два моніторинги одночасно: обидва комітять artifacts/
concurrency:
  group: monitor
  cancel-in-progress: false

# Комітимо стан стандартним GITHUB_TOKEN, окремий PAT не потрібен
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGETS: ${{ secrets.TARGETS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node ./src/monitor.js

      - name: Commit updated artifacts
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add artifacts/

          if ! git diff --cached --quiet; then
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B || echo "")
            if [ "$LAST_COMMIT_MSG" = "chore: update artifacts" ]; then
              git commit --amend --no-edit
            else
              git commit -m "chore: update artifacts"
            fi
            git push origin main --force-with-lease
          else
            echo "No changes to commit"
          fi
